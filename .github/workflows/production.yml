name: Production release (manual, verified)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY PRODUCTION after completing merchant/OAuth/manual QA checklist'
        required: true
        type: string
permissions:
  contents: read

jobs:
  release:
    name: Full verification and production deployment
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY PRODUCTION'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: typeracer-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require production Cloudflare credentials
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_ACCOUNT" || { echo "::error::Production Cloudflare account secret missing"; exit 1; }
          test -n "$CF_TOKEN" || { echo "::error::Production Cloudflare API token missing"; exit 1; }
      - name: Install npm 11
        run: npm install -g npm@11.6.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check types, unit tests, browser app
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Check native Cloudflare runtime, payment and reconnect invariants
        run: |
          npm run build:worker -w backend
          npm run test:runtime
          node --check scripts/smoke.mjs
      - name: Validate distinct production Worker bundle
        run: cd backend && npx wrangler deploy --dry-run --config wrangler.production.jsonc --outdir dist-production
      - name: Verify browser end-to-end
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:e2e
      - name: Deploy isolated production Worker only after all checks
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --config wrangler.production.jsonc
          packageManager: npm
      - name: Smoke-test the actual deployed production URL
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "::error::Wrangler returned no production URL"; exit 1; }
          node scripts/smoke.mjs "$DEPLOYMENT_URL"
          echo "## Production smoke verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
