name: Verify and deploy Cloudflare staging
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit tests and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install npm 11
        run: npm install -g npm@11.6.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build frontend and workspaces
        run: npm run build
      - name: Validate Worker bundle
        run: npm run build:worker -w backend
      - name: Check staging smoke-test script syntax
        run: node --check scripts/smoke.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (public matchmaking and private WebSocket)
        run: npm run test:e2e

  deploy-staging:
    name: Publish and smoke-test live staging
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: typeracer-cloudflare-staging
      cancel-in-progress: true
    env:
      CLOUDFLARE_READY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Report if Cloudflare access is not configured
        if: env.CLOUDFLARE_READY != 'true'
        run: |
          echo "::warning::Cloudflare deployment not attempted: CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN is missing."
          echo "## Cloudflare staging NOT deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Add Cloudflare GitHub Actions secrets, then select Run workflow on main. No new commit needed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_READY == 'true'
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_READY == 'true'
        with:
          node-version: '22'
      - name: Install npm 11
        if: env.CLOUDFLARE_READY == 'true'
        run: npm install -g npm@11.6.2
      - name: Install and build website
        if: env.CLOUDFLARE_READY == 'true'
        run: |
          npm install --no-audit --no-fund
          npm run build -w frontend
      - name: Deploy website, API and Durable Object
        id: deploy
        if: env.CLOUDFLARE_READY == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
          packageManager: npm
      - name: Verify live site, private rooms and public matchmaking
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "::error::No deployment URL; check your workers.dev subdomain."; exit 1; }
          node scripts/smoke.mjs "$DEPLOYMENT_URL"
          echo "## Cloudflare staging deployed and smoke-tested" >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
